<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="-10 -10 340 260" font-family="'Courier New', monospace">
  <!-- PERFORMANCE MONITOR - exact UI preview (320x240 landscape) -->
  <rect x="-10" y="-10" width="340" height="260" fill="#15181f"/>
  <rect x="0" y="0" width="320" height="240" fill="#0a0c12"/>

  <!-- ===== header ===== -->
  <rect x="0" y="0" width="320" height="26" fill="#0e121a"/>
  <line x1="0" y1="25" x2="320" y2="25" stroke="#3c424e" stroke-width="1"/>
  <text x="8" y="18" fill="#78e6f0" font-size="12" font-weight="bold">PERFORMANCE MONITOR</text>
  <text x="272" y="18" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="end">10:51</text>
  <text x="310" y="18" fill="#aab4be" font-size="8" text-anchor="end">PM</text>

  <!-- separators -->
  <line x1="160" y1="26" x2="160" y2="240" stroke="#3c424e" stroke-width="1"/>
  <line x1="0" y1="134" x2="320" y2="134" stroke="#3c424e" stroke-width="1"/>

  <!-- ===== CPU quadrant ===== -->
  <g font-size="11" font-weight="bold">
    <rect x="8" y="31" width="10" height="10" fill="none" stroke="#00e5ff" stroke-width="1.4"/>
    <rect x="11" y="34" width="4" height="4" fill="#00e5ff"/>
    <text x="26" y="41" fill="#00e5ff">CPU</text>
  </g>
  <rect x="8" y="48" width="142" height="2" fill="#00e5ff"/>
  <!-- gauge -->
  <g transform="rotate(135 36 80)">
    <circle cx="36" cy="80" r="20" fill="none" stroke="#3c424e" stroke-width="4" stroke-dasharray="94.2 31.4"/>
    <circle cx="36" cy="80" r="20" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="2 123" stroke-linecap="butt"/>
  </g>
  <text x="36" y="84" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">2 %</text>
  <!-- rows -->
  <g font-size="11" font-weight="bold">
    <text x="70" y="60" fill="#aab4be">Temp</text>
    <text x="150" y="60" fill="#ffffff" text-anchor="end">40 &#176;C</text>
    <text x="70" y="78" fill="#aab4be">Volt</text>
    <text x="150" y="78" fill="#ffffff" text-anchor="end">0.72 V</text>
    <text x="70" y="96" fill="#aab4be">Fan</text>
    <text x="150" y="96" fill="#ffffff" text-anchor="end">1880 RPM</text>
  </g>
  <!-- graph -->
  <polyline fill="none" stroke="#00e5ff" stroke-width="1.4"
    points="10,126 14,124 18,125 22,120 26,122 30,118 34,119 38,113 42,116 46,112 50,118 54,114 58,116 62,110 66,113 70,109 74,115 78,111 82,113 86,108 90,112 94,110 98,114 102,109 106,112 110,116 114,111 118,113 122,118 126,114 130,117 134,112 138,116 142,120 146,117"/>
  <line x1="10" y1="128" x2="148" y2="128" stroke="#3c424e" stroke-width="1"/>
  <rect x="8" y="129" width="142" height="2" fill="#00e5ff"/>

  <!-- ===== GPU quadrant ===== -->
  <g font-size="11" font-weight="bold">
    <rect x="170" y="31" width="12" height="10" fill="none" stroke="#ff7a00" stroke-width="1.4"/>
    <circle cx="174" cy="36" r="2" fill="none" stroke="#ff7a00" stroke-width="1"/>
    <text x="188" y="41" fill="#ff7a00">GPU</text>
    <text x="312" y="41" fill="#ff7a00" text-anchor="end">14 FPS</text>
  </g>
  <rect x="170" y="48" width="142" height="2" fill="#ff7a00"/>
  <g transform="rotate(135 198 80)">
    <circle cx="198" cy="80" r="20" fill="none" stroke="#3c424e" stroke-width="4" stroke-dasharray="94.2 31.4"/>
    <circle cx="198" cy="80" r="20" fill="none" stroke="#ff7a00" stroke-width="4" stroke-dasharray="13 112"/>
  </g>
  <text x="198" y="84" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">14 %</text>
  <g font-size="11" font-weight="bold">
    <text x="232" y="60" fill="#aab4be">Temp</text>
    <text x="312" y="60" fill="#ffffff" text-anchor="end">47 &#176;C</text>
    <text x="232" y="78" fill="#aab4be">VRAM</text>
    <text x="312" y="78" fill="#ffffff" text-anchor="end">16 %</text>
    <text x="232" y="96" fill="#aab4be">Fan</text>
    <text x="312" y="96" fill="#ffffff" text-anchor="end">1043 RPM</text>
  </g>
  <polyline fill="none" stroke="#ff7a00" stroke-width="1.4"
    points="172,127 176,126 180,127 184,123 188,125 192,122 196,124 200,119 204,122 208,120 212,123 216,118 220,121 224,119 228,122 232,117 236,120 240,118 244,121 248,116 252,119 256,117 260,120 264,118 268,121 272,116 276,119 280,117 284,120 288,118 292,121 296,117 300,119 304,116 308,119 312,117"/>
  <line x1="172" y1="128" x2="310" y2="128" stroke="#3c424e" stroke-width="1"/>
  <rect x="170" y="129" width="142" height="2" fill="#ff7a00"/>

  <!-- ===== MEMORY quadrant ===== -->
  <g font-size="11" font-weight="bold">
    <rect x="8" y="139" width="12" height="10" fill="none" stroke="#ffd200" stroke-width="1.4"/>
    <line x1="12" y1="141" x2="12" y2="147" stroke="#ffd200" stroke-width="1.2"/>
    <line x1="16" y1="141" x2="16" y2="147" stroke="#ffd200" stroke-width="1.2"/>
    <text x="26" y="149" fill="#ffd200">MEMORY</text>
  </g>
  <rect x="8" y="156" width="142" height="2" fill="#ffd200"/>
  <g font-size="11" font-weight="bold">
    <text x="8" y="171" fill="#aab4be">Usage</text>
    <text x="150" y="171" fill="#ffffff" text-anchor="end">40 %</text>
    <text x="8" y="195" fill="#aab4be">Freq</text>
    <text x="150" y="195" fill="#ffffff" text-anchor="end">2396 MHz</text>
    <text x="8" y="211" fill="#aab4be">Volt</text>
    <text x="150" y="211" fill="#ffffff" text-anchor="end">1.22 V</text>
  </g>
  <rect x="8" y="176" width="142" height="5" fill="#181c24"/>
  <rect x="8" y="176" width="57" height="5" fill="#ffd200"/>
  <polyline fill="none" stroke="#ffd200" stroke-width="1.4"
    points="10,234 14,233 18,234 22,231 26,233 30,232 34,233 38,230 42,232 46,231 50,233 54,232 58,230 62,231 66,229 70,231 74,230 78,232 82,231 86,229 90,230 94,228 98,230 102,229 106,231 110,230 114,232 118,231 122,233 126,231 130,232 134,230 138,231 142,233 146,232"/>
  <line x1="10" y1="236" x2="148" y2="236" stroke="#3c424e" stroke-width="1"/>
  <rect x="8" y="237" width="142" height="2" fill="#ffd200"/>

  <!-- ===== NETWORK quadrant ===== -->
  <g font-size="11" font-weight="bold">
    <circle cx="176" cy="144" r="5" fill="none" stroke="#2ee6a8" stroke-width="1.4"/>
    <line x1="176" y1="139" x2="176" y2="149" stroke="#2ee6a8" stroke-width="1"/>
    <line x1="171" y1="144" x2="181" y2="144" stroke="#2ee6a8" stroke-width="1"/>
    <text x="188" y="149" fill="#2ee6a8">NETWORK</text>
  </g>
  <rect x="170" y="156" width="142" height="2" fill="#2ee6a8"/>
  <g font-size="11" font-weight="bold">
    <text x="170" y="174" fill="#aab4be">Down</text>
    <text x="312" y="174" fill="#ffffff" text-anchor="end">12.4 MB/s</text>
    <text x="170" y="198" fill="#aab4be">Upload</text>
    <text x="312" y="198" fill="#ffffff" text-anchor="end">640 KB/s</text>
  </g>
  <polyline fill="none" stroke="#2ee6a8" stroke-width="1.4"
    points="172,236 176,235 180,236 184,234 188,235 192,236 196,233 200,235 204,234 208,222 212,214 216,218 220,212 224,216 228,220 232,215 236,218 240,213 244,217 248,221 252,216 256,219 260,214 264,218 268,222 272,217 276,220 280,215 284,219 288,223 292,218 296,221 300,216 304,220 308,217 312,219"/>
  <line x1="172" y1="236" x2="310" y2="236" stroke="#3c424e" stroke-width="1"/>
  <rect x="170" y="237" width="142" height="2" fill="#2ee6a8"/>
</svg>
