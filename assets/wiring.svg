<svg xmlns="http://www.w3.org/2000/svg" width="820" height="570" viewBox="0 0 820 570" font-family="Arial, sans-serif">
  <!-- ===== background ===== -->
  <rect x="0" y="0" width="820" height="570" fill="#14171e"/>
  <text x="410" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#ffffff">WIRING — ESP32 DevKit  →  2.8" ILI9341 TFT (SPI)</text>

  <!-- ===== ESP32 board ===== -->
  <rect x="40" y="62" width="260" height="386" rx="14" fill="#1b2430" stroke="#3d4a5c" stroke-width="2"/>
  <rect x="120" y="76" width="100" height="52" rx="6" fill="#2c3a4c" stroke="#5a6b80"/>
  <text x="170" y="107" text-anchor="middle" font-size="13" fill="#9fb2c8">ESP32 WROOM</text>
  <text x="170" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#e8eef5">ESP32 DEV KIT</text>
  <rect x="140" y="412" width="60" height="14" rx="3" fill="#2c3a4c"/>
  <text x="170" y="442" text-anchor="middle" font-size="10" fill="#7c8ba1">micro-USB → PC</text>

  <!-- ESP32 pins: labels INSIDE the board, wires from the board edge -->
  <g font-size="13" fill="#dfe7ef" text-anchor="end">
    <text x="290" y="180">VIN / 5V</text>
    <text x="290" y="210">3V3</text>
    <text x="290" y="240">GND</text>
    <text x="290" y="270">GPIO18 (SCK)</text>
    <text x="290" y="300">GPIO23 (MOSI)</text>
    <text x="290" y="330">GPIO19 (MISO)</text>
    <text x="290" y="360">GPIO22</text>
    <text x="290" y="390">GPIO21</text>
    <text x="290" y="416">GPIO27</text>
  </g>
  <g fill="#59c2ff">
    <circle cx="300" cy="176" r="5"/><circle cx="300" cy="206" r="5"/><circle cx="300" cy="236" r="5"/>
    <circle cx="300" cy="266" r="5"/><circle cx="300" cy="296" r="5"/><circle cx="300" cy="326" r="5"/>
    <circle cx="300" cy="356" r="5"/><circle cx="300" cy="386" r="5"/><circle cx="300" cy="412" r="5"/>
  </g>

  <!-- ===== TFT board ===== -->
  <rect x="520" y="62" width="260" height="386" rx="14" fill="#232a36" stroke="#3d4a5c" stroke-width="2"/>
  <rect x="545" y="86" width="210" height="140" rx="6" fill="#0a0c12" stroke="#4a5568"/>
  <text x="650" y="150" text-anchor="middle" font-size="13" fill="#78e6f0">2.8" TFT 240x320</text>
  <text x="650" y="172" text-anchor="middle" font-size="11" fill="#5c6b80">ILI9341 · SPI</text>
  <text x="650" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#e8eef5">TFT DISPLAY MODULE</text>
  <text x="650" y="312" text-anchor="middle" font-size="10" fill="#7c8ba1">(14-pin; touch pins stay unconnected)</text>

  <!-- TFT pins: labels INSIDE the board, wires stop at the board edge -->
  <g font-size="13" fill="#dfe7ef">
    <text x="530" y="180">VCC</text>
    <text x="530" y="210">LED</text>
    <text x="530" y="240">GND</text>
    <text x="530" y="270">SCK (CLK)</text>
    <text x="530" y="300">SDI (MOSI)</text>
    <text x="530" y="330">SDO (MISO)</text>
    <text x="530" y="360">CS</text>
    <text x="530" y="390">DC (RS / A0)</text>
    <text x="530" y="416">RESET</text>
  </g>
  <g fill="#ffb347">
    <circle cx="520" cy="176" r="5"/><circle cx="520" cy="206" r="5"/><circle cx="520" cy="236" r="5"/>
    <circle cx="520" cy="266" r="5"/><circle cx="520" cy="296" r="5"/><circle cx="520" cy="326" r="5"/>
    <circle cx="520" cy="356" r="5"/><circle cx="520" cy="386" r="5"/><circle cx="520" cy="412" r="5"/>
  </g>

  <!-- ===== wires ===== -->
  <g stroke-width="3" fill="none">
    <line x1="305" y1="176" x2="515" y2="176" stroke="#e04545"/>                        <!-- VIN -> VCC -->
    <line x1="305" y1="206" x2="515" y2="206" stroke="#f0a12e"/>                        <!-- 3V3 -> LED -->
    <line x1="305" y1="236" x2="515" y2="236" stroke="#aab4be"/>                        <!-- GND -> GND -->
    <line x1="305" y1="266" x2="515" y2="266" stroke="#e6d23c"/>                        <!-- 18 -> SCK -->
    <line x1="305" y1="296" x2="515" y2="296" stroke="#43c46b"/>                        <!-- 23 -> SDI -->
    <line x1="305" y1="326" x2="515" y2="326" stroke="#4f8de0" stroke-dasharray="8 6"/> <!-- 19 -> SDO optional -->
    <line x1="305" y1="356" x2="515" y2="356" stroke="#a76ee0"/>                        <!-- 22 -> CS -->
    <line x1="305" y1="386" x2="515" y2="386" stroke="#e07a3c"/>                        <!-- 21 -> DC -->
    <line x1="305" y1="412" x2="515" y2="412" stroke="#e8e8e8"/>                        <!-- 27 -> RST -->
  </g>

  <!-- ===== legend / notes ===== -->
  <rect x="40" y="466" width="740" height="88" rx="8" fill="#1b2230" stroke="#33415a"/>
  <g font-size="12" fill="#c8d2dd">
    <text x="56" y="490" font-weight="bold" fill="#ffffff">NOTES</text>
    <text x="56" y="510">• VCC → VIN (5V) when your display board has an onboard regulator (most 2.8" boards do). Use 3V3 ONLY if it has none.</text>
    <text x="56" y="528">• SDO/MISO (dashed wire) is optional — the firmware never reads from the display. LED → 3V3 gives full backlight.</text>
    <text x="56" y="546" fill="#7fe8a8">• No resistors, no extra modules needed. Touch pins (T_CLK, T_CS, T_DIN, T_DO, T_IRQ) stay unconnected.</text>
  </g>
</svg>
